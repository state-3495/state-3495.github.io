<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>State 3500 | Whiteout Survival</title>
<script src="config.js?v=5a866dde" defer></script>
<style>
  :root{
    --bg-0:#060b18; --bg-1:#0b1530; --bg-2:#0f1f45;
    --ink:#eaf2ff; --ink-dim:#93a4c8;
    --gold:#ffd76a; --gold-dim:#a9812f;
    --cyan:#4fd8ff; --cyan-dim:#1c6d8a;
    --green:#38e2a0; --red:#ff5d7a;
    --card:rgba(255,255,255,0.04);
    --card-border:rgba(255,255,255,0.09);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{
    background:
      radial-gradient(1100px 500px at 50% -10%, rgba(79,216,255,0.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(255,215,106,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2));
    color:var(--ink);
    padding:32px 16px 60px;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto}

  header{text-align:center;margin-bottom:28px;position:relative}
  .crown{font-size:11px;letter-spacing:0.2em;color:var(--gold);font-weight:700;
    text-shadow:0 0 12px rgba(255,215,106,0.6); margin-bottom:6px}
  header h1{
    font-size:40px;font-weight:900;letter-spacing:0.01em;
    background:linear-gradient(135deg,#fff 10%,var(--cyan) 55%,var(--gold) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 18px rgba(79,216,255,0.25));
  }
  header p{
    display:inline-block; margin-top:10px; padding:5px 14px; border-radius:999px;
    font-size:12px; font-weight:700; letter-spacing:0.08em;
    color:var(--gold); background:rgba(255,215,106,0.08);
    border:1px solid rgba(255,215,106,0.35);
    animation:glow 2.6s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ box-shadow:0 0 6px rgba(255,215,106,0.15); }
    50%{ box-shadow:0 0 18px rgba(255,215,106,0.45); }
  }

  .card{
    background:var(--card); backdrop-filter:blur(6px);
    border:1px solid var(--card-border); border-radius:18px;
    padding:20px; margin-bottom:16px;
    box-shadow:0 10px 30px -12px rgba(0,0,0,0.5);
    opacity:0; transform:translateY(10px);
    animation:rise 0.5s ease forwards;
  }
  .card:nth-of-type(1){animation-delay:0.02s}
  .card:nth-of-type(2){animation-delay:0.08s}
  .card:nth-of-type(3){animation-delay:0.14s}
  .card:nth-of-type(4){animation-delay:0.20s}
  .card:nth-of-type(5){animation-delay:0.26s}
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .card h2{
    font-size:12px; letter-spacing:0.14em; font-weight:800; text-transform:uppercase;
    color:var(--ink-dim); margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }
  .card h2::before{
    content:""; width:8px; height:8px; border-radius:2px;
    background:linear-gradient(135deg,var(--cyan),var(--gold));
    box-shadow:0 0 8px rgba(79,216,255,0.7);
  }

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
  .stats div{padding:10px 4px; border-radius:12px; background:rgba(255,255,255,0.03)}
  .stats span{display:block}
  .stats .val{
    font-size:22px;font-weight:800;
    background:linear-gradient(135deg,#fff,var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stats .label{font-size:11px;color:var(--ink-dim);margin-top:4px;letter-spacing:0.05em;text-transform:uppercase}

  .transfer-status{
    display:inline-block;padding:5px 14px;border-radius:999px;
    font-size:12px;font-weight:800;letter-spacing:0.08em;margin-bottom:14px;
  }
  .open{background:rgba(56,226,160,0.12);color:var(--green);border:1px solid rgba(56,226,160,0.4);
    animation:pulse-open 1.8s ease-in-out infinite}
  .closed{background:rgba(255,93,122,0.12);color:var(--red);border:1px solid rgba(255,93,122,0.4)}
  .leading-badge{
    display:none;margin-left:8px;padding:5px 14px;border-radius:999px;
    font-size:12px;font-weight:800;letter-spacing:0.08em;
    color:var(--gold);background:rgba(255,215,106,0.12);border:1px solid rgba(255,215,106,0.45);
  }
  .leading-badge.show{display:inline-block}
  @keyframes pulse-open{ 0%,100%{box-shadow:0 0 0 rgba(56,226,160,0.0)} 50%{box-shadow:0 0 14px rgba(56,226,160,0.5)} }

  .transfer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .transfer-group{font-size:14px;font-weight:800;color:var(--cyan)}
  .transfer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .transfer-box{background:rgba(255,255,255,0.03);border-radius:12px;padding:14px;text-align:center}
  .transfer-box.wide{grid-column:1 / -1}
  .transfer-box-label{font-size:10px;letter-spacing:0.08em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:6px}
  .transfer-box-value{font-size:15px;font-weight:800;color:var(--ink);word-break:break-word}
  .transfer-box.wide .transfer-box-value{font-size:20px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--ink-dim);font-weight:700;font-size:11px;letter-spacing:0.06em;
    text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--card-border)}
  td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.05)}
  tbody tr{transition:background 0.15s}
  tbody tr:hover{background:rgba(79,216,255,0.06)}
  tbody tr:last-child td{border-bottom:none}
  .rank-badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;height:26px;padding:0 6px;border-radius:8px;font-weight:800;font-size:13px;
    background:rgba(255,255,255,0.06);color:var(--ink-dim);
  }
  .rank-badge.r1{color:#1a1500;background:linear-gradient(135deg,var(--gold),#fff3cf);box-shadow:0 0 10px rgba(255,215,106,0.5)}
  .rank-badge.r2{color:#1a1d24;background:linear-gradient(135deg,#dfe6f0,#fff)}
  .rank-badge.r3{color:#2a160a;background:linear-gradient(135deg,#e0a76a,#f3d3ab)}

  .empty{color:var(--ink-dim);font-size:13px;font-style:italic}

  .gov-row{padding:10px 0;border-bottom:1px solid var(--card-border)}
  .gov-row:last-child{border-bottom:none}
  .gov-row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .gov-row-head b{font-size:14px;font-weight:700}
  .gov-status{font-size:12px;font-weight:800;color:var(--green)}
  .gov-desc{font-size:12.5px;color:var(--ink-dim);margin-bottom:6px}
  .meter{height:8px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden}
  .meter-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--green))}
  .gov-list{list-style:none;font-size:13px;color:var(--ink-dim)}
  .gov-list li{padding:6px 0 6px 18px;position:relative;border-bottom:1px solid rgba(255,255,255,0.04)}
  .gov-list li:last-child{border-bottom:none}
  .gov-list li::before{content:"›";position:absolute;left:0;color:var(--cyan);font-weight:800}
  .gov-subhead{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);margin:14px 0 6px}
  .gov-subhead:first-child{margin-top:0}

  .alliance-card{
    border:1px solid var(--card-border); border-radius:14px; padding:16px;
    margin-bottom:14px; background:rgba(255,255,255,0.02);
  }
  .alliance-card:last-child{margin-bottom:0}
  .alliance-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .alliance-name{
    font-size:21px;font-weight:900;letter-spacing:0.02em;
    background:linear-gradient(135deg,#fff 10%,var(--gold) 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .alliance-power{
    margin-left:auto;display:inline-flex;align-items:center;justify-content:center;
    min-width:56px;height:32px;padding:0 14px;flex-shrink:0;border-radius:999px;
    background:rgba(56,226,160,0.15);border:2px solid rgba(56,226,160,0.4);
    color:var(--green);font-weight:800;font-size:13px;text-align:center;
  }
  .alliance-desc{
    font-size:14px;line-height:1.6;color:var(--ink);font-weight:500;
    margin:10px 0 14px;white-space:pre-line;
  }
  .alliance-sub{
    background:rgba(255,255,255,0.025);border:1px solid var(--card-border);
    border-radius:12px;padding:12px;margin-top:12px;
  }
  .alliance-sub:first-of-type{margin-top:0}
  .alliance-sub h4{
    font-size:13px;font-weight:800;letter-spacing:0.04em;color:var(--cyan);
    margin-bottom:8px;
  }
  .note{color:var(--ink-dim);font-style:italic}
  .recruiting{
    font-size:12.5px; padding:8px 12px; margin-bottom:12px; border-radius:10px;
    background:rgba(255,215,106,0.07); border-left:3px solid var(--gold); color:var(--ink);
  }
  .recruiting b{color:var(--gold)}

  .player-list{display:flex;flex-direction:column}
  .player-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
  .player-row:last-child{border-bottom:none}
  .player-name{font-weight:700;font-size:13.5px}
  .player-meta{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .player-chip{font-size:11px;color:var(--ink-dim);background:rgba(255,255,255,0.05);padding:3px 9px;border-radius:999px}

  .event-list{display:flex;flex-direction:column;gap:10px}
  .event-card{border:1px solid var(--card-border);border-radius:12px;padding:12px;background:rgba(255,255,255,0.02)}
  .event-name{font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px}
  .event-times{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
  .event-time-box{background:rgba(255,255,255,0.03);border-radius:10px;padding:6px;text-align:center}
  .event-time-label{font-size:10px;letter-spacing:0.08em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:4px}
  .event-time-value{font-family:ui-monospace,"JetBrains Mono",Menlo,monospace;font-size:17px;font-weight:800;color:var(--cyan)}

  .discord-icon-btn{
    display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:8px;border:none;background:rgba(88,101,242,0.15);color:#8891ff;
    cursor:pointer;transition:background 0.15s;flex-shrink:0;
  }
  .discord-icon-btn:hover{background:rgba(88,101,242,0.3)}
  .discord-icon-btn svg{width:14px;height:14px}

  .discord-modal{
    display:none;position:fixed;inset:0;background:rgba(3,6,14,0.7);backdrop-filter:blur(2px);
    align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .discord-modal.open{display:flex}
  .discord-modal-box{
    background:var(--bg-1);border:1px solid var(--card-border);border-radius:16px;
    padding:20px;max-width:320px;width:100%;box-shadow:0 20px 50px -12px rgba(0,0,0,0.6);
  }
  .discord-modal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .discord-modal-head svg{width:22px;height:22px;color:#8891ff;flex-shrink:0}
  .discord-modal-name{font-weight:700;font-size:14px;word-break:break-all}
  .discord-copy-btn{
    width:100%;padding:10px;border-radius:10px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--cyan),var(--cyan-dim));color:#04131c;
    font-weight:800;font-size:13px;letter-spacing:0.03em;transition:opacity 0.15s;
  }
  .discord-copy-btn:hover{opacity:0.9}

  table.svs-table{width:100%;border-collapse:collapse;font-size:13px}
  table.svs-table th{text-align:center;color:var(--ink-dim);font-weight:700;font-size:11px;letter-spacing:0.06em;
    text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--card-border)}
  table.svs-table th:first-child{text-align:left}
  table.svs-table td{padding:10px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.05)}
  table.svs-table td:first-child{text-align:left;font-weight:700}
  table.svs-table tr:last-child td{border-bottom:none}
  .svs-icon{
    display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;
    border-radius:999px;font-weight:800;font-size:11px;letter-spacing:0.04em;
  }
  .svs-icon.win{background:rgba(56,226,160,0.15);color:var(--green)}
  .svs-icon.loss{background:rgba(255,93,122,0.15);color:var(--red)}
  .svs-score{color:var(--green);font-weight:800}
  .svs-footnote{margin-top:10px;font-size:11px;color:var(--ink-dim);text-align:center;font-style:italic}

  .timeline{position:relative;padding-left:18px}
  .timeline::before{
    content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;
    background:linear-gradient(180deg,var(--cyan),var(--card-border));
  }
  .timeline-item{position:relative;padding:0 0 18px 20px}
  .timeline-item:last-child{padding-bottom:0}
  .timeline-item::before{
    content:"";position:absolute;left:-19px;top:2px;width:10px;height:10px;border-radius:50%;
    background:var(--bg-1);border:2px solid var(--card-border);
  }
  .timeline-item.reached::before{border-color:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .timeline-item.current::before{border-color:var(--gold);box-shadow:0 0 10px var(--gold);background:var(--gold)}
  .timeline-day{font-size:11px;font-weight:800;color:var(--ink-dim);letter-spacing:0.06em;text-transform:uppercase}
  .timeline-item.reached .timeline-day{color:var(--cyan)}
  .timeline-item.current .timeline-day{color:var(--gold)}
  .timeline-title{font-weight:700;font-size:14px;margin:2px 0}
  .timeline-desc{font-size:13px;color:var(--ink-dim)}

  .update{padding:12px 0;border-bottom:1px solid var(--card-border)}
  .update:last-child{border-bottom:none}
  .update .meta{font-size:11px;color:var(--ink-dim);letter-spacing:0.04em}
  .update .title{font-weight:700;margin:3px 0;color:var(--cyan)}

  .live-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--red);margin-right:6px;
    box-shadow:0 0 8px var(--red);
    animation:live 1.4s ease-in-out infinite;
  }
  @keyframes live{ 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }

  footer{text-align:center;margin-top:24px;font-size:11px;color:var(--ink-dim);letter-spacing:0.04em}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="crown">WHITEOUT SURVIVAL</div>
    <h1 id="stateTitle">State</h1>
    <p id="stateTagline"></p>
  </header>

  <section class="card">
    <h2>State Info</h2>
    <div class="stats">
      <div><span class="val" id="svsRecord"></span><span class="label">SVS Record</span></div>
      <div><span class="val" id="napLevel"></span><span class="label">Nap Level</span></div>
      <div><span class="val" id="leadingStateWins"></span><span class="label">Leading State</span></div>
    </div>
  </section>

  <section class="card">
    <h2>Governance</h2>
    <div id="governance"></div>
  </section>

  <section class="card">
    <div class="transfer-top">
      <h2 style="margin-bottom:0">Transfer</h2>
      <span class="transfer-group" id="transferGroup"></span>
    </div>
    <div>
      <span class="transfer-status" id="transferStatus"></span><span class="leading-badge" id="leadingBadge">LEADING</span>
    </div>
    <div class="transfer-grid" id="transferGrid"></div>
  </section>

  <section class="card">
    <h2>Alliances</h2>
    <div id="alliances"></div>
  </section>

  <section class="card">
    <h2>SVS Track Record</h2>
    <div id="svsTable"></div>
    <p class="svs-footnote" id="svsFootnote"></p>
  </section>

  <section class="card">
    <h2>State Timeline</h2>
    <div class="timeline" id="timeline"></div>
  </section>

  <section class="card">
    <h2><span class="live-dot"></span>Live Updates</h2>
    <div id="updates"></div>
  </section>

  <footer>Powered by ZICO</footer>
</div>

<div class="discord-modal" id="discordModal">
  <div class="discord-modal-box">
    <div class="discord-modal-head">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.4-2.157 2.4z"/></svg>
      <span class="discord-modal-name" id="discordModalName"></span>
    </div>
    <button class="discord-copy-btn" id="discordCopyBtn">Copy</button>
  </div>
</div>

<script>
function renderTable(rows, excludeKeys) {
  excludeKeys = excludeKeys || [];
  if (!rows || !rows.length) return '<p class="empty">No data yet.</p>';
  const headers = Object.keys(rows[0]).filter((h) => !excludeKeys.includes(h));
  const thead = headers.map((h) => `<th>${h}</th>`).join('');
  const tbody = rows.map((r) => `<tr>${headers.map((h) => {
    const cls = h === 'note' ? ' class="note"' : '';
    return `<td${cls}>${r[h]}</td>`;
  }).join('')}</tr>`).join('');
  return `<table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>`;
}

const DISCORD_ICON_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.4-2.157 2.4z"/></svg>';

function renderPlayerCards(rows) {
  if (!rows || !rows.length) return '<p class="empty">No data yet.</p>';
  return `<div class="player-list">${rows.map((r) => {
    const keys = Object.keys(r);
    const [nameKey, ...metaKeys] = keys;
    const chips = metaKeys.map((k) => {
      if (k.toLowerCase() === 'discord' && r[k]) {
        return `<button class="discord-icon-btn" data-discord="${r[k]}" title="Discord: ${r[k]}">${DISCORD_ICON_SVG}</button>`;
      }
      return r[k] ? `<span class="player-chip">${r[k]}</span>` : '';
    }).join('');
    return `<div class="player-row"><span class="player-name">${r[nameKey]}</span><span class="player-meta">${chips}</span></div>`;
  }).join('')}</div>`;
}

function renderSvsTable(rows) {
  if (!rows || !rows.length) return '<p class="empty">No data yet.</p>';
  const icon = (v) => v === 'TRUE'
    ? '<span class="svs-icon win">WIN</span>'
    : '<span class="svs-icon loss">LOSE</span>';
  const body = rows.map((r) => `<tr><td>${r.enemy}</td><td>${icon(r.prep)}</td><td>${icon(r.battle)}</td><td class="svs-score">${r.score}</td></tr>`).join('');
  return `<table class="svs-table"><thead><tr><th>Enemy</th><th>Prep</th><th>Battle</th><th>Score</th></tr></thead><tbody>${body}</tbody></table>`;
}

function renderEventCards(rows) {
  if (!rows || !rows.length) return '<p class="empty">No data yet.</p>';
  return `<div class="event-list">${rows.map((r) => {
    const keys = Object.keys(r);
    const [nameKey, ...timeKeys] = keys;
    const boxes = timeKeys.map((k) => `<div class="event-time-box"><div class="event-time-label">${k}</div><div class="event-time-value">${r[k] || '-'}</div></div>`).join('');
    return `<div class="event-card"><div class="event-name">${r[nameKey]}</div><div class="event-times">${boxes}</div></div>`;
  }).join('')}</div>`;
}

function rankBadge(ranking) {
  const n = String(ranking);
  const cls = ['1', '2', '3'].includes(n) ? ` r${n}` : '';
  return `<span class="rank-badge${cls}">#${ranking}</span>`;
}

function renderAlliances(alliances, council, events) {
  if (!alliances || !alliances.length) return '<p class="empty">No data yet.</p>';
  return alliances.map((a) => {
    const own = (rows) => (rows || []).filter((r) => r.alliance === a.tag).map(({ alliance, ...rest }) => rest);
    const alliancePlayers = own(council);
    const allianceEvents = own(events);
    return `
      <div class="alliance-card">
        <div class="alliance-head">
          ${rankBadge(a.ranking)}
          <span class="alliance-name">${a.tag ? `[${a.tag}] ` : ''}${a.name}</span>
          <span class="alliance-power">${a.power}</span>
        </div>
        ${a.description && a.description !== '-' ? `<div class="alliance-desc">${a.description}</div>` : ''}
        ${a.recruiting && a.recruiting !== '-' ? `<div class="recruiting"><b>Looking for:</b> ${a.recruiting}</div>` : ''}
        <div class="alliance-sub">
          <h4>Featured Players</h4>
          ${renderPlayerCards(alliancePlayers)}
        </div>
        <div class="alliance-sub">
          <h4>Events</h4>
          ${renderEventCards(allianceEvents)}
        </div>
      </div>`;
  }).join('');
}

function renderGovernance(gov, rules) {
  gov = gov || {};
  const overview = `
    <div class="gov-row">
      <div class="gov-row-head"><b>${gov.peaceLevelLabel || 'Peace Level'}</b><span class="gov-status">${gov.peaceLevelStatus || ''}</span></div>
      <div class="gov-desc">${gov.peaceLevelDescription || ''}</div>
      <div class="meter"><div class="meter-fill" style="width:${gov.peaceLevelPercentage || 0}%"></div></div>
    </div>
    <div class="gov-row">
      <div class="gov-row-head"><b>${gov.napCoverageValue || ''}</b><span class="gov-status">NAP Coverage</span></div>
      <div class="gov-desc">${gov.napCoverageDescription || ''}</div>
    </div>
    <div class="gov-row">
      <div class="gov-row-head"><b>${gov.kePolicyValue || ''}</b><span class="gov-status">KE Policy</span></div>
      <div class="gov-desc">${gov.kePolicyDescription || ''}</div>
    </div>`;

  const list = (rows, key) => (rows && rows.length)
    ? `<ul class="gov-list">${rows.map((r) => `<li>${r[key]}</li>`).join('')}</ul>`
    : '<p class="empty">No data yet.</p>';

  return `
    ${overview}
    <div class="gov-subhead">Rules</div>
    ${list(rules, 'rule')}`;
}

function stateAgeInDays(birthDate) {
  const start = new Date(birthDate);
  if (Number.isNaN(start.getTime())) return null;
  return Math.floor((Date.now() - start.getTime()) / 86400000);
}

function openDiscordModal(username) {
  document.getElementById('discordModalName').textContent = username;
  document.getElementById('discordCopyBtn').textContent = 'Copy';
  document.getElementById('discordModal').classList.add('open');
}

function closeDiscordModal() {
  document.getElementById('discordModal').classList.remove('open');
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.discord-icon-btn');
  if (btn) { openDiscordModal(btn.dataset.discord); return; }
  if (e.target.id === 'discordModal') closeDiscordModal();
});

document.getElementById('discordCopyBtn').addEventListener('click', () => {
  const username = document.getElementById('discordModalName').textContent;
  navigator.clipboard.writeText(username).then(() => {
    document.getElementById('discordCopyBtn').textContent = 'Copied!';
  });
});

window.addEventListener('DOMContentLoaded', () => {
  const { info, transfer, governance, rules, council, alliances, events, svs, timeline, updates } = CONFIG;

  document.getElementById('stateTitle').textContent = `State ${info.number}`;
  document.getElementById('stateTagline').textContent = info.tagline;
  document.getElementById('svsRecord').textContent = info.svsRecord;
  document.getElementById('napLevel').textContent = info.napLevel;
  document.getElementById('leadingStateWins').textContent = info.leadingStateWins;

  document.getElementById('governance').innerHTML = renderGovernance(governance, rules);

  const statusEl = document.getElementById('transferStatus');
  statusEl.textContent = transfer.isOpen ? 'OPEN' : 'CLOSED';
  statusEl.className = `transfer-status ${transfer.isOpen ? 'open' : 'closed'}`;
  document.getElementById('leadingBadge').classList.toggle('show', transfer.leadingState === true);

  document.getElementById('transferGroup').textContent = transfer.groupNumber ? `Group #${transfer.groupNumber}` : '';

  const eligible = ['Eligible States', `${transfer.eligibleStatesStart} ~ ${transfer.eligibleStatesEnd}`];
  const fields = [
    ['Period', `${transfer.periodStart} ~ ${transfer.periodEnd}`],
    ['Spots Left', `${transfer.spotsLeft} / ${transfer.spotsTotal}`],
    ['Power Cap', transfer.powerCap],
    ['Special Tickets', transfer.specialTickets || '-'],
  ];
  const box = ([k, v], wide) => `<div class="transfer-box${wide ? ' wide' : ''}"><div class="transfer-box-label">${k}</div><div class="transfer-box-value">${v}</div></div>`;
  document.getElementById('transferGrid').innerHTML = box(eligible, true) + fields.map((f) => box(f, false)).join('');

  document.getElementById('alliances').innerHTML = renderAlliances(alliances, council, events);

  document.getElementById('svsTable').innerHTML = renderSvsTable(svs);
  document.getElementById('svsFootnote').textContent = info.svsNote || '';

  const age = stateAgeInDays(info.birthDate);
  const rows = timeline || [];
  const reachedIdx = age === null ? -1
    : rows.reduce((best, t, i) => (Number(t.day) <= age ? i : best), -1);

  document.getElementById('timeline').innerHTML = rows.length
    ? rows.map((t, i) => {
        const cls = i === reachedIdx ? 'timeline-item current' : i < reachedIdx ? 'timeline-item reached' : 'timeline-item';
        return `<div class="${cls}"><div class="timeline-day">Day ${t.day}</div><div class="timeline-title">${t.title}</div><div class="timeline-desc">${t.description}</div></div>`;
      }).join('')
    : '<p class="empty">No data yet.</p>';

  document.getElementById('updates').innerHTML = updates
    .map(u => `<div class="update"><div class="meta">${u.date} ${u.time}</div><div class="title">${u.title}</div><div>${u.message}</div></div>`)
    .join('');
});
</script>
</body>
</html>
