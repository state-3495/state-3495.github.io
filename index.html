<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>State 3500 | Whiteout Survival</title>
<script src="config.js" defer></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
  body{background:linear-gradient(to bottom,#f8fafc,#f0f9ff,#f1f5f9);color:#0f172a;padding:24px 16px 60px}
  .wrap{max-width:640px;margin:0 auto}
  header{text-align:center;margin-bottom:24px}
  header h1{font-size:32px;font-weight:900}
  header p{color:#0284c7;font-weight:600;margin-top:4px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px -4px rgba(0,0,0,0.05)}
  .card h2{font-size:14px;letter-spacing:0.05em;color:#64748b;text-transform:uppercase;margin-bottom:12px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
  .stats div span{display:block}
  .stats .val{font-size:20px;font-weight:700}
  .stats .label{font-size:12px;color:#64748b;margin-top:2px}
  .transfer-status{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:12px}
  .open{background:#dcfce7;color:#166534}
  .closed{background:#fee2e2;color:#991b1b}
  .transfer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px}
  .transfer-grid div{display:flex;justify-content:space-between;border-bottom:1px dashed #e2e8f0;padding:6px 0}
  .transfer-grid b{color:#64748b;font-weight:500}
  .update{padding:10px 0;border-bottom:1px solid #f1f5f9}
  .update:last-child{border-bottom:none}
  .update .meta{font-size:12px;color:#94a3b8}
  .update .title{font-weight:700;margin:2px 0}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1 id="stateTitle">State</h1>
    <p id="stateTagline"></p>
  </header>

  <section class="card">
    <h2>State Info</h2>
    <div class="stats">
      <div><span class="val" id="svsRecord"></span><span class="label">SVS Record</span></div>
      <div><span class="val" id="napLevel"></span><span class="label">Nap Level</span></div>
      <div><span class="val" id="ranking"></span><span class="label">Ranking</span></div>
    </div>
  </section>

  <section class="card">
    <h2>Transfer</h2>
    <span class="transfer-status" id="transferStatus"></span>
    <div class="transfer-grid" id="transferGrid"></div>
  </section>

  <section class="card">
    <h2>Live Updates</h2>
    <div id="updates"></div>
  </section>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const { info, transfer, updates } = CONFIG;

  document.getElementById('stateTitle').textContent = `State ${info.number}`;
  document.getElementById('stateTagline').textContent = info.tagline;
  document.getElementById('svsRecord').textContent = info.svsRecord;
  document.getElementById('napLevel').textContent = info.napLevel;
  document.getElementById('ranking').textContent = info.ranking;

  const statusEl = document.getElementById('transferStatus');
  statusEl.textContent = transfer.isOpen ? 'OPEN' : 'CLOSED';
  statusEl.className = `transfer-status ${transfer.isOpen ? 'open' : 'closed'}`;

  const fields = [
    ['Group', transfer.groupNumber],
    ['Eligible', `${transfer.eligibleStatesStart} ~ ${transfer.eligibleStatesEnd}`],
    ['Period', `${transfer.periodStart} ~ ${transfer.periodEnd}`],
    ['Spots', `${transfer.spotsLeft} / ${transfer.spotsTotal}`],
    ['Power Cap', transfer.powerCap],
  ];
  document.getElementById('transferGrid').innerHTML = fields
    .map(([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`)
    .join('');

  document.getElementById('updates').innerHTML = updates
    .map(u => `<div class="update"><div class="meta">${u.date} ${u.time}</div><div class="title">${u.title}</div><div>${u.message}</div></div>`)
    .join('');
});
</script>
</body>
</html>
