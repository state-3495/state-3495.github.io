name: Sync Google Sheet

on:
  schedule:
    - cron: "0 0 * * *" # 09:00 KST (UTC+9)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-sheet.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.js index.html
          git diff --cached --quiet || git commit -m "Sync config.js from Google Sheet"
          git push
